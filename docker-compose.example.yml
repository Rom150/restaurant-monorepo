version: '3.8'
services:
  db:
    image: postgres:13
    environment:
      # Set these values in a local .env file (DO NOT commit .env)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - db-data:/var/lib/postgresql/data
  app:
    build: ./backend
    environment:
      JWT_SECRET: ${JWT_SECRET:-changeme}
    depends_on:
      - db

volumes:
  db-data:
